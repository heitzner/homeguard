# /etc/portage/make.conf
# -- LICENSE -- #
ACCEPT_LICENSE="*"

# -- SYSTEM DEFAULTS -- #
INPUT_DEVICES="libinput"
VIDEO_CARDS="intel nvidia"
LC_MESSAGES=C.UTF-8
GRUB_PLATFORMS="efi-64"
CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sse sse2 sse3 sse4_1 sse4_2 ssse3"

# -- PORTAGE -- #
PORTAGE_TMPDIR="/var/tmp"
PORTAGE_SCHEDULING_POLICY="idle"
PORTAGE_NICENESS="19"
PORTAGE_IONICE_COMMAND="ionice -c 3 -p \${PID}"
AUTOCLEAN="yes"

# -- FLAGS -- #
COMMON_FLAGS="-march=haswell -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="${RUSTFLAGS} -C target-cpu=haswell"

# -- EMERGE DEFAULTS -- #
EMERGE_DEFAULT_OPTS="--jobs 2 --load-average 3.5 --verbose --with-bdeps=y --complete-graph --backtrack=50 --binpkg-respect-use=y --binpkg-changed-deps=y --getbinpkg=y"
MAKEOPTS="-j2 -l2"

# -- BINHOST -- #
FEATURES="getbinpkg candy parallel-fetch parallel-install buildpkg binpkg-multi-instance clean-logs"

# -- USE -- #
KDE="kde plasma qt6 qdbus policykit jpeg png webp gif tiff svg brotli gdbm gstreamer utils widgets layouts"
# ------
GLOBAL="X wayland egl gbm screencast networkmanager pipewire sound-server elogind dbus udev alsa dist-kernel samba"
# -------
DISABLED="-systemd -gnome -dvd -cdr -telemetry -bluetooth -pulseaudio -jack -accessibility"
USE="${KDE} ${GLOBAL} ${DISABLED}"
